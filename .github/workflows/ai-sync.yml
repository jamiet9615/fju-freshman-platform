name: AI Schedule Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天午夜 00:00 (UTC) 自動執行
  workflow_dispatch:     # 允許在 GitHub Actions 手動點擊執行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 賦予 Git 權限以便自動把更新後的 json commit 回倉庫

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "chore: auto-sync AI schedule data via agent"
          git push
