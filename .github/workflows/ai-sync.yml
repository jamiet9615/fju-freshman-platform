name: AI Schedule Sync

on:
  schedule:
    - cron: '0 0 * * *' # 每天午夜 00:00 (UTC) 自動執行
  workflow_dispatch:     # 允許在 GitHub Actions 頁面手動點擊執行 (Run workflow)

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Run AI Sync Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py # 假設你的 Python 程式碼放在根目錄叫 agent.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "chore: auto-sync AI schedule data"
          git push
